[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-authority"
version = "0.1.0"
description = "Synchronous Python client for the Venue Authority API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Venue Authority"}]
keywords = ["venue-authority", "food-service", "kyb", "payments", "regulator-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://venueauthority.com/developers"
Source = "https://github.com/kingymon1/venue-authority-api/tree/main/packages/python-sdk"
Issues = "https://github.com/kingymon1/venue-authority-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venue_authority = ["py.typed"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
